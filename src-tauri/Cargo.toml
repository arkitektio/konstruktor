[package]
name = "konstruktor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Konstruktor — create and manage Arkitekt hub deployments."
authors = ["Johannes Roos"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "konstruktor-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
konstruktor-core.workspace = true
serde_json.workspace = true
serde.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
thiserror.workspace = true
strip-ansi-escapes.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "rt", "macros"] }
tokio-util.workspace = true
dirs.workspace = true
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-http = "2"

[features]
# this feature is used for production builds where `frontendDist` points to the filesystem
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
