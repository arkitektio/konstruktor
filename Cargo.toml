# Konstruktor is one product with two front ends: a Tauri desktop app and a `konstruktor`
# CLI. Everything they both do — authoring a hub profile, generating the compose project,
# authorizing against a coordination server, driving Docker — lives in `konstruktor-core`,
# so neither front end can drift from the other.
[workspace]
resolver = "2"
members = ["crates/konstruktor-core", "crates/konstruktor-cli", "src-tauri"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/arkitektio/konstruktor"

[workspace.dependencies]
konstruktor-core = { path = "crates/konstruktor-core" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
inquire = "0.7"
base64 = "0.22"
dirs = "6"
dns-lookup = "3.0"
network-interface = "2.0"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
strip-ansi-escapes = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"
tokio = "1"
tokio-util = "0.7"

# A debug build of the desktop app is ~330MB, and nearly all of that is DWARF for every
# variable in every dependency. Line tables alone still give a backtrace its file and line
# — which is the part anyone reads — and `target/debug/deps` keeps every binary it has
# ever built, so the saving is per stale copy, not once.
[profile.dev]
debug = "line-tables-only"
