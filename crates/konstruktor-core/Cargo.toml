[package]
name = "konstruktor-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Generates Arkitekt hub deployments: the profile, the compose project, and the service configs."

[dependencies]
base64.workspace = true
dirs.workspace = true
dns-lookup.workspace = true
network-interface.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
rsa.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
# RFC 7638 thumbprints of the instance keys; already in the tree through ed25519-dalek.
sha2 = "0.10"
strip-ansi-escapes.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "rt", "macros", "process", "fs", "io-util", "net"] }
tokio-util.workspace = true
# `join_all`: the images of a hub are asked, fetched and prepared side by side.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
