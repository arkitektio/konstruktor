services:
  db:
    image: jhnnsrs/daten:latest
    environment:
      POSTGRES_MULTIPLE_DATABASES: rekuest,kabinet,mikro,fluss,kraph
      POSTGRES_PASSWORD: 6jagim0s4a8qj2ibcrugqh4gsrbq1m4t39q8xnoq
      POSTGRES_USER: small-glade
    volumes:
    - db_data:/var/lib/postgresql/data
  redis:
    image: redis:8.10.1
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: hidden-field
      RUSTFS_SECRET_KEY: 0fwf70hpwv5wvkpf8snbeizb7asirjjb18tc5yj9
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: :9000
    user: 0:0
    stop_grace_period: 2s
    volumes:
    - rustfs_data:/data
  rustfs_init:
    image: jhnnsrs/init:latest
    volumes:
    - ./configs/rustfs_init.yaml:/workspace/config.yaml
    stop_grace_period: 2s
    environment:
      RUSTFS_ACCESS_KEY: hidden-field
      RUSTFS_SECRET_KEY: 0fwf70hpwv5wvkpf8snbeizb7asirjjb18tc5yj9
      RUSTFS_HOST: http://rustfs:9000
    depends_on:
      rustfs:
        condition: service_started
  rekuest:
    image: jhnnsrs/rekuest:latest
    command: bash run.sh
    depends_on:
    - redis
    - db
    - rustfs
    stop_grace_period: 2s
    volumes:
    - ./configs/rekuest.yaml:/workspace/config.yaml
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 300s
  kabinet:
    image: jhnnsrs/kabinet:latest
    command: bash run.sh
    depends_on:
    - redis
    - db
    - rustfs
    stop_grace_period: 2s
    volumes:
    - ./configs/kabinet.yaml:/workspace/config.yaml
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 300s
  mikro:
    image: jhnnsrs/mikro:latest
    command: bash run.sh
    depends_on:
    - redis
    - db
    - rustfs
    stop_grace_period: 2s
    volumes:
    - ./configs/mikro.yaml:/workspace/config.yaml
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 300s
  fluss:
    image: jhnnsrs/fluss:latest
    command: bash run.sh
    depends_on:
    - redis
    - db
    - rustfs
    stop_grace_period: 2s
    volumes:
    - ./configs/fluss.yaml:/workspace/config.yaml
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 300s
  kraph:
    image: jhnnsrs/kraph:latest
    command: bash run.sh
    depends_on:
    - redis
    - db
    - rustfs
    stop_grace_period: 2s
    volumes:
    - ./configs/kraph.yaml:/workspace/config.yaml
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 300s
  rekuest-takt:
    image: jhnnsrs/rekuest-takt:latest
    depends_on:
    - db
    - redis
    - rekuest
    stop_grace_period: 2s
    volumes:
    - ./configs/rekuest.yaml:/workspace/config.yaml:ro
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 300s
  gateway:
    image: caddy:2.11.4
    ports:
    - 18480:80
    - 18443:443
    networks:
    - late-moon
    - default
    volumes:
    - ./configs/Caddyfile:/etc/caddy/Caddyfile
networks:
  late-moon:
    driver: bridge
    name: late-moon
volumes:
  db_data: {}
  rustfs_data: {}
