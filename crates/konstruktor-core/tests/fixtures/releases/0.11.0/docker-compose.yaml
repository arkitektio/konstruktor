services:
  db:
    image: jhnnsrs/daten:latest
    environment:
      POSTGRES_MULTIPLE_DATABASES: rekuest,kabinet,mikro,fluss,kraph
      POSTGRES_PASSWORD: zh70548ss2zeka30lywryzkkwikoinntebqoz7k4
      POSTGRES_USER: brave-shadow
    volumes:
    - db_data:/var/lib/postgresql/data
  redis:
    image: redis:8.10.1
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: small-smoke
      RUSTFS_SECRET_KEY: 940e6mc7rvi15bqhv5izd3a33mv8pazuha8l4cc2
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: :9000
    user: 0:0
    stop_grace_period: 2s
    volumes:
    - rustfs_data:/data
  rustfs_init:
    image: jhnnsrs/init:latest
    volumes:
    - ./configs/rustfs_init.yaml:/workspace/config.yaml
    stop_grace_period: 2s
    environment:
      RUSTFS_ACCESS_KEY: small-smoke
      RUSTFS_SECRET_KEY: 940e6mc7rvi15bqhv5izd3a33mv8pazuha8l4cc2
      RUSTFS_HOST: http://rustfs:9000
    depends_on:
      rustfs:
        condition: service_started
  rekuest:
    image: jhnnsrs/rekuest:latest
    command: bash run.sh
    depends_on:
    - redis
    - db
    - rustfs
    stop_grace_period: 2s
    volumes:
    - ./configs/rekuest.yaml:/workspace/config.yaml
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 300s
  kabinet:
    image: jhnnsrs/kabinet:latest
    command: bash run.sh
    depends_on:
    - redis
    - db
    - rustfs
    stop_grace_period: 2s
    volumes:
    - ./configs/kabinet.yaml:/workspace/config.yaml
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 300s
  mikro:
    image: jhnnsrs/mikro:latest
    command: bash run.sh
    depends_on:
    - redis
    - db
    - rustfs
    stop_grace_period: 2s
    volumes:
    - ./configs/mikro.yaml:/workspace/config.yaml
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 300s
  fluss:
    image: jhnnsrs/fluss:latest
    command: bash run.sh
    depends_on:
    - redis
    - db
    - rustfs
    stop_grace_period: 2s
    volumes:
    - ./configs/fluss.yaml:/workspace/config.yaml
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 300s
  kraph:
    image: jhnnsrs/kraph:latest
    command: bash run.sh
    depends_on:
    - redis
    - db
    - rustfs
    stop_grace_period: 2s
    volumes:
    - ./configs/kraph.yaml:/workspace/config.yaml
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 300s
  rekuest-reaper:
    image: jhnnsrs/rekuest:latest
    command: bash run-reaper.sh
    depends_on:
    - db
    - redis
    - rekuest
    stop_grace_period: 2s
    volumes:
    - ./configs/rekuest.yaml:/workspace/config.yaml
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 300s
    healthcheck:
      test:
      - CMD
      - python
      - manage.py
      - reaper
      - --check
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
  gateway:
    image: caddy:2.11.4
    ports:
    - 18480:80
    - 18443:443
    networks:
    - noisy-cherry
    - default
    volumes:
    - ./configs/Caddyfile:/etc/caddy/Caddyfile
networks:
  noisy-cherry:
    driver: bridge
    name: noisy-cherry
volumes:
  db_data: {}
  rustfs_data: {}
