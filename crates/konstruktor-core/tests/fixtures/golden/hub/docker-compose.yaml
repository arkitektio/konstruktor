services:
  db:
    image: jhnnsrs/daten:latest
    environment:
      POSTGRES_MULTIPLE_DATABASES: rekuest_main,kabinet_main,mikro_main,fluss_main,kraph_main
      POSTGRES_PASSWORD: fixture-postgres-password-not-a-real-secret
      POSTGRES_USER: fixture-postgres-user-not-a-real-secret
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -h
      - 127.0.0.1
      - -U
      - fixture-postgres-user-not-a-real-secret
      interval: 3s
      timeout: 5s
      retries: 40
    volumes:
    - ./db_data:/var/lib/postgresql/data
  redis:
    image: redis:latest
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: fixture-root-user-not-a-real-secret
      RUSTFS_SECRET_KEY: fixture-root-password-not-a-real-secret
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: :9000
    user: '0:0'
    stop_grace_period: 2s
    volumes:
    - /data:/data
  rustfs_init:
    image: jhnnsrs/init:latest
    volumes:
    - ./configs/rustfs_init.yaml:/workspace/config.yaml
    stop_grace_period: 2s
    environment:
      RUSTFS_ACCESS_KEY: fixture-root-user-not-a-real-secret
      RUSTFS_SECRET_KEY: fixture-root-password-not-a-real-secret
      RUSTFS_HOST: http://rustfs:9000
    depends_on:
      rustfs:
        condition: service_started
  rekuest:
    image: jhnnsrs/rekuest:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rustfs:
        condition: service_started
      rustfs_init:
        condition: service_completed_successfully
    stop_grace_period: 2s
    volumes:
    - ./configs/rekuest.yaml:/workspace/config.yaml
    - takt_run:/run/takt
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 300s
  kabinet:
    image: jhnnsrs/kabinet:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rustfs:
        condition: service_started
      rustfs_init:
        condition: service_completed_successfully
    stop_grace_period: 2s
    volumes:
    - ./configs/kabinet.yaml:/workspace/config.yaml
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 300s
  mikro:
    image: jhnnsrs/mikro:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rustfs:
        condition: service_started
      rustfs_init:
        condition: service_completed_successfully
    stop_grace_period: 2s
    volumes:
    - ./configs/mikro.yaml:/workspace/config.yaml
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 300s
  fluss:
    image: jhnnsrs/fluss:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rustfs:
        condition: service_started
      rustfs_init:
        condition: service_completed_successfully
    stop_grace_period: 2s
    volumes:
    - ./configs/fluss.yaml:/workspace/config.yaml
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 300s
  kraph:
    image: jhnnsrs/kraph:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rustfs:
        condition: service_started
      rustfs_init:
        condition: service_completed_successfully
    stop_grace_period: 2s
    volumes:
    - ./configs/kraph.yaml:/workspace/config.yaml
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 300s
  rekuest-takt:
    image: jhnnsrs/rekuest-takt:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rekuest:
        condition: service_started
    stop_grace_period: 2s
    environment:
      TAKT_INTERNAL_BIND: unix:/run/takt/internal.sock
    volumes:
    - ./configs/rekuest.yaml:/workspace/config.yaml:ro
    - takt_run:/run/takt
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 300s
  gateway:
    image: caddy:latest
    ports:
    - 8080:80
    - 8443:443
    networks:
    - polished-meadow
    - default
    volumes:
    - ./configs/Caddyfile:/etc/caddy/Caddyfile
networks:
  polished-meadow:
    driver: bridge
    name: polished-meadow
volumes:
  takt_run: {}
