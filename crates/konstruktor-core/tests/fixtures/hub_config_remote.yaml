backend: docker
config:
  coord_server: coord.example.org
  csrf_trusted_origins:
  - https://hub.example.org
  db:
    enabled: true
    github_repo: https://github.com/arkitektio/daten-server
    host: daten
    image: jhnnsrs/daten:latest
    mount: null
    postgres_password: fixture-postgres-password-not-a-real-secret
    postgres_user: fixture-postgres-user-not-a-real-secret
    volume_name: db_data
  default_service_grace_period_seconds: 2
  device_id: konstruktor-test
  domain: hub.example.org
  gateway:
    auto_https: true
    enabled: true
    exposed_http_port: 80
    exposed_https_port: 443
    host: gateway
    image: caddy:latest
    internal_port: 80
    ssl: true
    ssl_cert: null
  global_admin: admin
  global_admin_email: null
  global_admin_password: fixture-global-admin-password-not-a-real-secret
  global_description: null
  internal_network: quiet-brook
  local_redis:
    enabled: true
    host: redis
    image: redis:latest
    internal_port: 6379
  minio:
    access_key: fixture-access-key-not-a-real-secret
    console_port: 9001
    enabled: true
    exposed_console_port: null
    host: rustfs
    image: rustfs/rustfs:latest
    init_container_host: rustfs_init
    init_container_image: jhnnsrs/init:latest
    internal_port: 9000
    mount: null
    root_password: fixture-root-password-not-a-real-secret
    root_user: fixture-root-user-not-a-real-secret
    secret_key: fixture-secret-key-not-a-real-secret
    volume_name: rustfs_data
  rekuest_server: rekuest.example.org
  services:
    alpaka:
      admin_config:
        kind: global
      allowed_hosts:
      - '*'
      auth_config:
        kind: local
      buckets:
        media:
          bucket_name: alpakamedia
          kind: local
      databases:
        main: alpaka_main
      debug: false
      enabled: true
      host: alpaka
      identifier: live.arkitekt.alpaka
      image: jhnnsrs/alpaka:latest
      internal_port: 80
      mount_github: false
      ollama_config:
        kind: local
      path_config:
        kind: local
      redis_config:
        kind: local
      secret_key: fixture-secret-key-not-a-real-secret
      source:
        path: /workspace
        repository: https://github.com/arkitektio/alpaka-server
    elektro:
      admin_config:
        kind: global
      allowed_hosts:
      - '*'
      auth_config:
        kind: local
      buckets:
        media:
          bucket_name: elektromedia
          kind: local
        zarr:
          bucket_name: elektrozarr
          kind: local
        parquet:
          bucket_name: elektroparquet
          kind: local
        bigfile:
          bucket_name: elektrobigfile
          kind: local
      databases:
        main: elektro_main
      debug: false
      enabled: true
      host: elektro
      identifier: live.arkitekt.elektro
      image: jhnnsrs/elektro:latest
      internal_port: 80
      mount_github: false
      path_config:
        kind: local
      redis_config:
        kind: local
      secret_key: fixture-secret-key-not-a-real-secret
      source:
