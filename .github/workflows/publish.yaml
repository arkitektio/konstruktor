name: "Publish Everything"

on:
  push:
    branches: [master]

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: setup pnpm
        uses: pnpm/action-setup@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev
      - name: install app dependencies
        run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: konstruktor-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version
          releaseName: "Konstruktor v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false

  # The CLI ships as a plain binary per target, next to the desktop app's installers in
  # the same draft release. `needs: publish-tauri` so the draft exists to upload into.
  publish-cli:
    needs: publish-tauri
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: test
        run: cargo test -p konstruktor-core -p konstruktor-cli
      - name: build
        run: cargo build --release -p konstruktor-cli --target ${{ matrix.target }}

      - name: package (unix)
        if: matrix.platform != 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/konstruktor konstruktor-${{ matrix.target }}
          shasum -a 256 konstruktor-${{ matrix.target }} > konstruktor-${{ matrix.target }}.sha256
      - name: package (windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/konstruktor.exe konstruktor-${{ matrix.target }}.exe
          sha256sum konstruktor-${{ matrix.target }}.exe > konstruktor-${{ matrix.target }}.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            konstruktor-${{ matrix.target }}*

  # One checksum file for the whole release: the installer refuses to install without it.
  publish-checksums:
    needs: publish-cli
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - name: collect checksums
        run: cat dist/*.sha256 | sed 's| .*/| |' > dist/SHA256SUMS && cat dist/SHA256SUMS
      - name: upload to the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release upload "konstruktor-v$version" \
            dist/konstruktor-* dist/SHA256SUMS --clobber
